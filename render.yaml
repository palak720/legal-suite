services:
  - type: web
    name: legal-suite
    runtime: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz